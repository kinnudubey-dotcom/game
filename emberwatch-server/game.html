<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emberwatch</title>
<style>
:root{--bg:#120c14;--ink:#f8ecd6;--mut:#d6bd9c;--rust:#f08a35;--panel:#251b2a;--line:#6e4d46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;margin:0}
#wrap{width:100%}
#hud{display:none;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 12px;background:var(--panel);border:3px solid var(--line);border-bottom-width:0;margin:0;font-size:14px;padding:5px 10px;gap:4px 14px}
.hp{display:flex;gap:2px}.hp i{width:10px;height:12px;background:#d8453a;box-shadow:inset -2px -2px #7a1f17}.hp i.e{background:#3a2a2e;box-shadow:none}
.chip{display:flex;align-items:center;gap:6px}.chip b{width:11px;height:11px;display:inline-block}
.dots{display:flex;gap:2px}.dots u{width:7px;height:12px;display:block;text-decoration:none}
#stage{position:relative}
canvas{width:100%;aspect-ratio:16/9;image-rendering:pixelated;display:block;border:3px solid var(--line);background:#000;cursor:crosshair;touch-action:none}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(14,9,16,.88);padding:10px;z-index:3}
.ov.on{display:flex}
.box{background:var(--panel);border:3px solid var(--rust);padding:16px;max-width:480px;width:100%;max-height:100%;overflow:auto}
h1,h2,h3{margin:0 0 8px;color:var(--rust);font-weight:800}
h1{font-size:26px;letter-spacing:1.5px}h2{font-size:20px}h3{font-size:14px}
button{font:inherit;font-size:14px;color:var(--ink);background:#3e2d31;border:3px solid var(--line);padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--rust);color:#120c14}
.sk button.dim{opacity:.6}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #fff}
.t{font-size:15px;font-weight:600;margin:0 0 10px;color:#fff2dc}
.t2{font-size:13px;color:var(--mut);font-weight:500;margin:0 0 8px;line-height:1.45}
.rec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:15px}
.rec span{flex:1}.rec small{display:block;color:var(--mut);font-size:13px;font-weight:500}
#touch{position:absolute;inset:0;display:none;pointer-events:none;z-index:2;user-select:none;-webkit-user-select:none;touch-action:none}
#touch.on{display:block}
#touch>*{pointer-events:auto;touch-action:none}
#joy{position:absolute;left:3.5%;bottom:5%;width:min(26%,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(20,12,24,.35) 0 55%,rgba(20,12,24,.55) 100%);border:3px solid rgba(240,217,181,.55)}
#joy i{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd9a0,#c8642a 70%);border:3px solid #2a150e;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.tbtn{position:absolute;border-radius:50%;border:3px solid #2a150e;display:flex;align-items:center;justify-content:center;padding:0;background:radial-gradient(circle at 35% 30%,#ff9a52,#b33c1c 75%);box-shadow:0 3px 0 rgba(0,0,0,.55);color:#fff}
.tbtn:active,.tbtn.dn{transform:translateY(2px);filter:brightness(1.2)}
.tbtn svg{width:62%;height:62%;image-rendering:pixelated;shape-rendering:crispEdges}
#atk{right:3.5%;bottom:5%;width:min(22%,104px);aspect-ratio:1}
.tsm{width:min(11%,52px);aspect-ratio:1;background:radial-gradient(circle at 35% 30%,#6b5a78,#33283c 75%);border-color:#150d1a;opacity:.92}
#act{right:4%;bottom:calc(5% + min(22%,104px)*1.0 + 10px);width:min(14%,66px);aspect-ratio:1;background:radial-gradient(circle at 35% 30%,#ffe08a,#c8962a 75%);display:none;animation:pls 1s infinite alternate}
@keyframes pls{to{transform:scale(1.1)}}
#tq{right:calc(3.5% + min(22%,104px) + 8px);bottom:5%}
#tw{right:calc(3.5% + min(22%,104px) + 8px);bottom:calc(5% + min(11%,52px) + 6px)}
#te{right:calc(3.5% + min(22%,104px)*1.0 + 8px + min(11%,52px) + 6px);bottom:5%}
p.help{display:none;font-size:13px;color:var(--mut);margin:8px 0 0;font-weight:500}
.ic{width:20px;height:20px;image-rendering:pixelated;vertical-align:middle}.rec .ic{width:28px;height:28px}
#hint{position:absolute;left:8px;right:8px;bottom:10px;text-align:center;font-size:15px;font-weight:700;background:rgba(14,9,16,.9);border:2px solid var(--line);padding:6px 10px;pointer-events:none;display:none;z-index:1;text-shadow:0 1px 0 #000}
body.tch #hint{bottom:auto;top:44px;font-size:13px}
#feed{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:1;max-width:62%}
#feed div{background:rgba(14,9,16,.85);padding:3px 8px;font-size:13px;border-left:4px solid var(--line);text-shadow:0 1px 0 #000}
.tb{position:absolute;top:8px;right:8px;display:none;gap:6px;z-index:2}.tb.on{display:flex}.tb button{padding:5px 10px;font-size:13px;opacity:.95}
.lob{position:absolute;inset:0;display:none;z-index:2}
.lob.on{display:flex}
.pn{width:min(460px,100%);height:100%;overflow:auto;background:linear-gradient(90deg,rgba(14,9,16,.97),rgba(14,9,16,.9));border-right:3px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:9px}
.sub{font-size:13px;color:var(--mut);font-weight:500;margin-top:-4px}
.big{display:block;width:100%;text-align:left;padding:8px 14px;font-size:19px;font-weight:800;border-color:var(--rust)}
.big small{display:block;font-size:13px;color:var(--mut);font-weight:500}
.big:hover:not(:disabled) small{color:#120c14}
.big.alt{border-color:var(--line);font-size:16px}
.card{background:rgba(37,27,42,.95);border:3px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:7px}
.card label{font-size:13px;color:var(--mut)}
input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:#120c14;border:3px solid var(--line);padding:6px 8px;width:100%}
.sws{display:flex;gap:7px}.sw{width:30px;height:30px;padding:0;border:3px solid #000}
.sw.on{outline:3px solid #fff}
.wg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.wg button{padding:5px 2px;display:flex;flex-direction:column;align-items:center;font-size:12px;line-height:1.2;gap:3px;text-align:center}
.wg button.on{background:var(--rust);color:#120c14;border-color:#fff}
.wg .ic{width:24px;height:24px}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:6px 4px;font-size:14px}.seg button.on{background:var(--rust);color:#120c14}
.row{display:flex;flex-direction:column;gap:4px}
.wi{font-size:14px;color:var(--ink);font-weight:500}
.mmc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.mmc ul{list-style:none;margin:0;padding:0;font-size:14px}
.mmc li{display:flex;justify-content:space-between;padding:3px 4px;border-bottom:1px solid #4a3a3e}
.mmc li span{color:#9a8878}.mmc li.r span{color:#9df09d}
.skg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sk{background:rgba(37,27,42,.97);border:3px solid var(--line);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sk.on{border-color:var(--rust)}
.sk img.pv{width:64px;height:72px;image-rendering:pixelated}
.sk b{font-size:15px}.sk small{font-size:12.5px;color:var(--mut);font-weight:500;line-height:1.3}
.sk button{width:100%;padding:6px;font-size:14px}
.sk.row2{flex-direction:row;justify-content:space-between}
.sk.row2 button{width:auto;min-width:90px}
.lvg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.lv{padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.1}
.lv b{font-size:18px}.lv span{font-size:11px;color:#ffd25a;font-weight:600;letter-spacing:1px}
.lv.lock{opacity:.5}.lv.lock span{color:var(--mut);letter-spacing:0}
.lv.on{border-color:var(--rust);background:#5a3b2c}
.code{font-size:40px;font-weight:800;letter-spacing:10px;color:#ffd25a;text-align:center;margin:4px 0}
.bal{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.bal b{color:#ffd25a}
.note{background:#3e2d31;border-left:4px solid var(--rust);padding:7px 10px;font-size:14px}
@media (max-width:560px){
 .pn{width:100%;border-right:0}
}
#rot{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;font-size:20px}
#rot i{display:block;width:70px;height:44px;border:4px solid var(--rust);border-radius:8px;animation:rt 2s ease-in-out infinite}
@keyframes rt{0%,25%{transform:rotate(90deg)}65%,100%{transform:rotate(0)}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}#wrap{display:none}}
@media (pointer:coarse) and (max-height:480px){
 #hud{font-size:12px;padding:3px 8px;gap:2px 10px}.hp i{width:8px;height:9px}
 .pn{width:min(380px,58%);padding:6px 10px;gap:6px}.pn h1{font-size:22px;margin:0}
 .big{padding:7px 12px;font-size:16px}.big small{font-size:11px}
 .card{padding:7px 9px}.tb button{padding:3px 8px;font-size:12px}
 #hint{font-size:12px;padding:3px 8px}
}
</style>
</head>
<body>
<div id="rot"><i></i><div>Turn your phone sideways to play</div></div>
<div id="wrap">
<div id="hud"></div>
<div id="stage">
<canvas id="c" width="320" height="180"></canvas>
<div id="feed"></div><div id="hint"></div>
<div id="touch"><div id="joy" aria-label="Move joystick"><i></i></div><button class="tbtn tsm" id="tw" aria-label="Swap weapon"></button><button class="tbtn tsm" id="te" aria-label="Eat"></button><button class="tbtn tsm" id="tq" aria-label="Squad orders"></button><button class="tbtn" id="act" aria-label="Interact"></button><button class="tbtn" id="atk" aria-label="Attack"></button></div>
<div class="tb" id="tb"><button id="bp">Pause</button><button id="bm">Sound</button></div>
<div class="lob on" id="lobby"><div class="pn" id="pn"></div></div>
<div class="ov" id="craft"><div class="box"><h2>Crafting table</h2><div id="recs"></div><button id="close">Back to the fight</button></div></div>
<div class="ov" id="pause"><div class="box"><h2>Paused</h2><p class="t">P or Esc to resume. M toggles sound.</p><button id="rs">Resume</button> <button id="quit">Quit to lobby</button></div></div>
<div class="ov" id="mm"><div class="box"><h2 id="mmT">Finding a match</h2><div class="mmc"><div><h3 id="mmH0">Your team</h3><ul id="mmA"></ul></div><div><h3 id="mmH1">Enemy team</h3><ul id="mmB"></ul></div></div><p id="mmM" class="t"></p><p class="t2">No servers are online, so AI players fill every slot.</p><button id="mmX">Cancel</button></div></div>
<div class="ov" id="over"><div class="box"><h2 id="ovT">You fell</h2><p id="sum" class="t"></p><button id="again">Play again</button> <button id="nextLv" style="display:none">Next level</button> <button id="toLobby">Lobby</button></div></div>
</div>
<p class="help" id="help"></p>
</div>

function netTick(dt){
 if(!onl)return;const now=performance.now(),S=onl.snaps;
 if(S.length){
  const rt=now-110;let a=S[0],b=S[S.length-1];
  for(let i=S.length-1;i>=0;i--){if(S[i].t<=rt){a=S[i];b=S[i+1]||S[i];break}}
  const span=b.t-a.t,k=span>0?Math.max(0,Math.min(1,(rt-a.t)/span)):1,L=S[S.length-1].m.f;
  F.forEach((f,i)=>{const A=a.m.f[i],B=b.m.f[i],C=b.m.f[i];if(!A||!B)return;
   const jump=Math.hypot(B[0]-A[0],B[1]-A[1])>60,kk=jump?1:k;
   f.x=A[0]+(B[0]-A[0])*kk;f.y=A[1]+(B[1]-A[1])*kk;
   let da=B[2]-A[2];while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;f.a=A[2]+da*k;
   f.hp=C[3];f.sw=C[4];f.sd=(WP[C[5]]||WP[1]).sw;if(!(i===onl.you&&now<onl.eqUntil))f.eq=C[5];
   const bi=C[6];f.alive=!!(bi&1);f.mv=!!(bi&2);f.fl=(bi&4)?.1:0;f.inv=C[7];f.k=C[8];f.d=C[9];f.rt=C[10];if(f.mv)f.ph+=dt*13});
  /* my own fighter: respond to input at once, then ease toward the server's newest position */
  const M=L[onl.you];if(M&&me.alive){const sp=me.spd||62;
   let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joy.on&&(joy.x||joy.y)){ix=joy.x;iy=joy.y}
   const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}if(state!=='play'||cd>0||me.sw>0){ix*=me.sw>0?.62:0;iy*=me.sw>0?.62:0}
   if(Math.hypot(M[0]-onl.px,M[1]-onl.py)>30){onl.px=M[0];onl.py=M[1]}
   onl.px=Math.max(X0,Math.min(X1,onl.px+ix*sp*dt));onl.py=Math.max(Y0,Math.min(Y1,onl.py+iy*sp*dt));

  else if(M){onl.px=M[0];onl.py=M[1]}}

 if(now-onl.lastIn>50){onl.lastIn=now;
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joy.on&&(joy.x||joy.y)){ix=joy.x;iy=joy.y}
  const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
  const live=state==='play'&&me.alive&&cd<=0;if(!live){ix=iy=0}
  if(me.mouse)onl.a=Math.atan2(ptr.y-me.y,ptr.x-me.x);else if(touchMode&&keys.j&&nearEnemy(me))onl.a=Math.atan2(nearEnemy(me).y-me.y,nearEnemy(me).x-me.x);else if(l>.05)onl.a=Math.atan2(iy,ix);
